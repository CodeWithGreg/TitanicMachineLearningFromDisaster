[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic_ml"
version = "0.1.0"
description = "Python package for the Kaggle Titanic - Machine Learning from Disaster challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "xgboost>=1.7",
    "jupyter>=1.0",
    "shap>=0.42",
    "imbalanced-learn>=0.11",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["titanic_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
